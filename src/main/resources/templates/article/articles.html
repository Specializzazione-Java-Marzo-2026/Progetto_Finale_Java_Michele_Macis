<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body>
    <head th:insert="~{index :: navbar}"></head>

    <div class="min-vh-100 py-5">
        <div th:if="${successMessage}" class="alert alert-success rounded-4 mx-3 mx-lg-5">
            <p class="mb-0" th:text="${successMessage}"></p>
        </div>

        <div class="container">
            <div class="row justify-content-center mb-4">
                <div class="col-lg-8 text-center">
                    <span class="badge-soft">Archivio</span>
                    <h1 class="section-title mt-3" th:text="${title}">Index article</h1>
                    <p class="text-muted">Sfoglia i contenuti più interessanti e scegli quello che vuoi leggere.</p>
                </div>
            </div>
        </div>

        <div class="container" th:if="${articles.size() > 0}">
            <div class="row g-4 mb-5">
                <div th:each="article:${articles}" class="col-12 col-md-6 col-lg-4">
                    <div class="card h-100">
                        <img th:if="${article.image != null}" th:src="${article.image.path}" class="card-img-top" alt="...">
                        <img th:unless="${article.image != null}" th:src="@{/images/default.jpg}" class="card-img-top" alt="...">

                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold" th:text="${article.title}"></h5>
                            <p class="card-text text-muted" th:text="${article.subtitle}"></p>
                            <div class="mt-auto d-flex justify-content-between align-items-center">
                                <span class="text-muted small" th:text="${article.user.username}"></span>
                                <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="btn btn-primary">Leggi</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center py-5" th:unless="${articles.size() > 0}">
            <div class="col-10 text-center">
                <h3 class="section-title">NESSUN ARTICOLO PRESENTE</h3>
                <p class="text-muted">Torna presto: nuovi contenuti stanno per arrivare.</p>
            </div>
        </div>
    </div>

    <head th:insert="~{index :: footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
