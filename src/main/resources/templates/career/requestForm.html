<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body>
    <head th:insert="~{index :: navbar}"></head>

    <div class="min-vh-100 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                        <div class="card-body p-4 p-lg-5">
                            <div class="text-center mb-4">
                                <span class="badge-soft">Collabora con noi</span>
                                <h1 class="section-title mt-3 mb-2" th:text="${title}">Richiesta collaborazione</h1>
                                <p class="text-muted">Condividi il tuo profilo e descrivi il ruolo che desideri ricoprire.</p>
                            </div>

                            <form th:action="@{/operations/career/request/save}" method="POST" th:object="${careerRequest}" enctype="multipart/form-data">
                                <div class="mb-3">
                                    <label for="body" class="form-label fw-semibold">Motivo della richiesta</label>
                                    <textarea id="body" class="form-control rounded-3" th:field="*{body}" rows="5" placeholder="Inserisci motivazione...."></textarea>
                                </div>

                                <div class="mb-4">
                                    <label for="role" class="form-label fw-semibold">Per quale ruolo?</label>
                                    <select id="role" th:field="*{role}" class="form-select rounded-3">
                                        <option th:each="role:${roles}" th:value="${role.id}" th:text="${#strings.substring(role.name, 5)}"></option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary px-4">Effettua richiesta</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <head th:insert="~{index :: footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
