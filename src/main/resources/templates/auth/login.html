<!DOCTYPE html>
<html lang="en" 
xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>
<body> 
    <head th:insert="~{index :: navbar}"></head>

    <div class="min-vh-100 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div th:if="${param.error}" class="alert alert-danger rounded-4">Credenziali non valide, riprova!</div>
                    <div th:if="${param.logout}" class="alert alert-success rounded-4">Logout avvenuto con successo!</div>

                    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                        <div class="card-body p-4 p-lg-5">
                            <div class="text-center mb-4">
                                <span class="badge-soft">Accesso</span>
                                <h2 class="mt-3 mb-2 fw-bold">Accedi al tuo account</h2>
                                <p class="text-muted mb-0">Bentornato su Aulab Chronicle.</p>
                            </div>
                            <form method="post" role="form" th:action="@{/login}" class="form-horizontal">
                                <div class="form-group mb-3">
                                    <label class="form-label fw-semibold">Email</label>
                                    <input type="text" class="form-control rounded-3" id="username" name="username" placeholder="Inserisci l'email">
                                </div>
                                <div class="form-group mb-3">
                                    <label class="form-label fw-semibold">Password</label>
                                    <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Inserisci la password">
                                </div>
                                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary px-4">Accedi</button>
                                    <span class="text-muted">Non hai un account? <a th:href="@{/register}" class="text-decoration-none fw-semibold">Registrati</a></span>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <head th:insert="~{index :: footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
