<!DOCTYPE html>
<html lang="en" 
xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body> 
    <head th:insert="~{index :: navbar}"></head>

    <div class="min-vh-100 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                        <div class="card-body p-4 p-lg-5">
                            <div class="text-center mb-4">
                                <span class="badge-soft">Registrazione</span>
                                <h2 class="mt-3 mb-2 fw-bold">Crea il tuo account</h2>
                                <p class="text-muted mb-0">Unisciti a Aulab Chronicle e inizia a leggere e scrivere.</p>
                            </div>
                            <div th:if="${param.success}" class="alert alert-info rounded-4">
                                Registrazione avvenuta con successo!
                            </div>
                            <form method="post" role="form" th:action="@{/register/save}" th:object="${user}">
                                <div class="row g-3">
                                    <div class="col-md-6 form-group">
                                        <label class="form-label fw-semibold">Nome</label>
                                        <input type="text" class="form-control rounded-3" id="firstName" placeholder="Inserisci il nome" th:field="*{firstName}" required>
                                        <p th:errors="*{firstName}" class="text-danger" th:if="${#fields.hasErrors('firstName')}"></p>
                                    </div>
                                    <div class="col-md-6 form-group">
                                        <label class="form-label fw-semibold">Cognome</label>
                                        <input type="text" class="form-control rounded-3" id="lastName" placeholder="Inserisci il cognome" th:field="*{lastName}" required>
                                        <p th:errors="*{lastName}" class="text-danger" th:if="${#fields.hasErrors('lastName')}"></p>
                                    </div>
                                    <div class="col-md-6 form-group">
                                        <label class="form-label fw-semibold">Email</label>
                                        <input type="email" class="form-control rounded-3" id="email" placeholder="Inserisci l'email" th:field="*{email}" required>
                                        <p th:errors="*{email}" class="text-danger" th:if="${#fields.hasErrors('email')}"></p>
                                    </div>
                                    <div class="col-md-6 form-group">
                                        <label class="form-label fw-semibold">Password</label>
                                        <input type="password" class="form-control rounded-3" id="password" placeholder="Inserisci la password" th:field="*{password}" required>
                                        <p th:errors="*{password}" class="text-danger" th:if="${#fields.hasErrors('password')}"></p>
                                    </div>
                                </div>
                                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary px-4">Registrati</button>
                                    <span class="text-muted">Hai già un account? <a th:href="@{/login}" class="text-decoration-none fw-semibold">Accedi</a></span>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <head th:insert="~{index :: footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
